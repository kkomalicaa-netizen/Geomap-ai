<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f6fff" />
      <stop offset="100%" stop-color="#00b37e" />
    </linearGradient>
    <linearGradient id="polyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f6fff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0057d9" stop-opacity="0.7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f6fff" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Shield/Rounded Tile -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#0f172a" />
  <rect x="2" y="2" width="44" height="44" rx="12" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Geospatial Vector Contours -->
  <path d="M10 24C16 20 22 28 28 22C34 16 40 22 42 20" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2" />
  
  <!-- Harmonized Cadastral Polygons -->
  <polygon points="12,18 24,10 36,17 28,30 15,26" fill="url(#polyGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" fill-opacity="0.4" />
  <polygon points="20,22 34,18 38,32 26,38 18,32" fill="#00b37e" fill-opacity="0.25" stroke="#00b37e" stroke-width="1.5" />
  
  <!-- AI Alignment Nodes -->
  <circle cx="24" cy="10" r="2.5" fill="#38bdf8" />
  <circle cx="36" cy="17" r="2.5" fill="#00b37e" />
  <circle cx="28" cy="30" r="3" fill="#ffffff" stroke="#0f6fff" stroke-width="2" />
  <circle cx="12" cy="18" r="2.5" fill="#38bdf8" />
  <circle cx="26" cy="38" r="2.5" fill="#00b37e" />
  
  <!-- Central Pulse Radar Point -->
  <circle cx="27" cy="24" r="1.5" fill="#ffffff" />
</svg>
